<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Self-hosted control panel for Discord bots." />
  <title>BotPanel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236366f1'/><circle cx='36' cy='45' r='7' fill='white'/><circle cx='64' cy='45' r='7' fill='white'/><rect x='32' y='64' width='36' height='6' rx='3' fill='white'/></svg>" />
  <link rel="stylesheet" href="__ASSET_BASE__/css/app.css" />
</head>
<body>

<!-- ── Auth gate ─────────────────────────────────────────────────────────── -->
<div id="gate" class="gate" hidden>
  <div class="gate-glow" aria-hidden="true"></div>
  <form id="gate-form" class="gate-card" autocomplete="on">
    <div class="gate-mark"><svg class="icon"><use href="#i-bot"/></svg></div>
    <h1 id="gate-title">Welcome back</h1>
    <p id="gate-sub" class="muted">Sign in to your panel.</p>

    <label class="field">
      <span>Username</span>
      <input id="gate-username" name="username" autocomplete="username" required autofocus />
    </label>

    <label class="field" id="gate-email-field" hidden>
      <span>Email <em class="muted">optional</em></span>
      <input id="gate-email" name="email" type="email" autocomplete="email" />
    </label>

    <label class="field">
      <span>Password</span>
      <input id="gate-password" name="password" type="password" autocomplete="current-password" required />
    </label>

    <p id="gate-error" class="gate-error" hidden></p>
    <button id="gate-submit" class="btn btn-primary btn-block" type="submit">Sign in</button>
    <p class="gate-alt center" hidden id="gate-alt">
      <a href="#" id="gate-toggle"></a>
    </p>
    <p class="gate-foot muted" id="gate-foot"></p>
  </form>
</div>

<!-- ── App shell ─────────────────────────────────────────────────────────── -->
<div id="app" class="shell" hidden>
  <aside class="sidebar">
    <a class="brand" href="#/">
      <span class="brand-mark"><svg class="icon"><use href="#i-bot"/></svg></span>
      <span class="brand-text"><span id="brand-name">BotPanel</span><em id="ws-dot" class="ws-dot" title="Realtime connection"></em></span>
    </a>

    <nav class="nav">
      <a class="nav-item" href="#/" data-nav="overview"><svg class="icon"><use href="#i-grid"/></svg>Overview</a>
      <a class="nav-item" href="#/activity" data-nav="activity"><svg class="icon"><use href="#i-activity"/></svg>Activity</a>
      <a class="nav-item" href="#/settings" data-nav="settings"><svg class="icon"><use href="#i-settings"/></svg>Settings</a>
      <a class="nav-item" href="#/admin" data-nav="admin" id="nav-admin" hidden><svg class="icon"><use href="#i-server"/></svg>Administration</a>
    </nav>

    <div class="side-head">
      <span>Bots</span>
      <button class="icon-btn" id="side-new" title="New bot (N)" hidden><svg class="icon"><use href="#i-plus"/></svg></button>
    </div>
    <div id="side-bots" class="side-bots"></div>

    <div class="side-foot">
      <button class="side-user" id="open-palette" title="Command palette (Ctrl+K)">
        <svg class="icon"><use href="#i-search"/></svg>
        <span>Search</span>
        <kbd>⌘K</kbd>
      </button>
      <div class="side-account">
        <span id="who" class="muted"></span>
        <button class="icon-btn" id="logout" title="Sign out"><svg class="icon"><use href="#i-logout"/></svg></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div id="crumbs" class="crumbs"></div>
      <div id="host-strip" class="host-strip"></div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<div id="palette" class="palette" hidden>
  <div class="palette-box">
    <div class="palette-input">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="palette-q" placeholder="Jump to a bot, or run a command…" autocomplete="off" spellcheck="false" />
      <kbd>esc</kbd>
    </div>
    <div id="palette-list" class="palette-list"></div>
  </div>
</div>

<script type="module" src="__ASSET_BASE__/js/app.js"></script>
</body>
</html>
