name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities do not belong here — see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a bot from …
        2. Click Deploy
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Panel version
      description: Settings → Host → Version
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options:
        - Docker / Compose
        - Bare metal (install.sh)
        - Bare metal (manual)
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: From `docker logs botpanel` or `journalctl -u botpanel`.
      render: shell
